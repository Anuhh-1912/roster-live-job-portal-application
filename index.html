<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roster | Find your next role</title>
<meta name="description" content="Browse real, current job openings with workplace, average salary and time commitment, then apply in minutes." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #06060A; --bg2: #0C0C13; --panel: #11111A; --panel2: #181824; --line: #272738;
  --text: #F4F5FA; --soft: #C9CBDA; --muted: #8E91A6;
  --blue: #2D6BFF; --blue-hover: #4D83FF; --blue-soft: #7FA5FF; --blue-bg: rgba(45,107,255,.14);
  --red: #F0373A; --red-hover: #FF5558; --red-bg: rgba(240,55,58,.14);
  --font: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px; --max: 1140px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue-hover); outline-offset: 2px; }
.wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 22px; }

/* top bar */
.topbar { background: rgba(6,6,10,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.topbar .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--blue); position: relative; }
.brand-mark::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg); }
.nav { display: flex; gap: 4px; }
.nav a { padding: 8px 14px; border-radius: 8px; color: var(--soft); font-weight: 600; font-size: 14.5px; }
.nav a:hover { background: var(--panel2); color: var(--text); }
.nav a.active { color: var(--text); background: var(--blue-bg); }
.pill { background: var(--red); color: #fff; border-radius: 99px; font-size: 11px; padding: 1px 7px; margin-left: 5px; font-weight: 700; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 11px 20px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; transition: background .12s, border-color .12s; text-align: center; }
.btn-blue { background: var(--blue); color: #fff; } .btn-blue:hover { background: var(--blue-hover); }
.btn-red { background: var(--red); color: #fff; } .btn-red:hover { background: var(--red-hover); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--soft); } .btn-ghost:hover { border-color: var(--blue-soft); color: #fff; }
.btn-ghost[aria-pressed="true"] { border-color: var(--red); color: #fff; background: var(--red-bg); }
.btn-block { width: 100%; } .btn-sm { padding: 7px 13px; font-size: 13.5px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; width: 100%; }
.field textarea { resize: vertical; min-height: 130px; }
.field input::placeholder, .field textarea::placeholder { color: #5E6178; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-bg); }
.field select option { background: var(--panel); }
.field .invalid { border-color: var(--red); }
.err { color: var(--red-hover); font-size: 12.5px; margin: 0; min-height: 0; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--soft); }
.check input { width: 17px; height: 17px; accent-color: var(--blue); margin-top: 3px; flex: none; }

/* hero */
.hero { background: radial-gradient(700px 320px at 12% -10%, rgba(45,107,255,.38), transparent 70%), radial-gradient(560px 300px at 95% 0%, rgba(240,55,58,.26), transparent 70%), var(--bg); border-bottom: 1px solid var(--line); padding: 54px 0 34px; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--soft); border: 1px solid var(--line); background: rgba(17,17,26,.7); border-radius: 99px; padding: 5px 14px; margin: 0 0 20px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.hero h1 { font-size: clamp(34px, 6vw, 62px); line-height: 1.04; font-weight: 800; letter-spacing: -.035em; margin: 0 0 16px; max-width: 14em; }
.hero h1 .blue { color: var(--blue-soft); }
.lead { color: var(--soft); max-width: 58ch; margin: 0 0 28px; font-size: 17px; }
.searchbar { display: grid; grid-template-columns: 1.5fr 1fr auto; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.searchbar .field input { background: var(--bg2); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 0; font-size: 13.5px; color: var(--muted); }
.quick button { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; color: var(--soft); font-size: 13.5px; font-weight: 600; }
.quick button:hover { border-color: var(--blue); color: #fff; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 26px 0 0; color: var(--muted); font-size: 14px; }
.stats b { color: #fff; font-size: 20px; margin-right: 5px; font-weight: 800; }
.stats .red b { color: var(--red-hover); }

/* layout */
.layout { display: grid; grid-template-columns: 262px 1fr; gap: 30px; padding: 30px 0 80px; align-items: start; }
.filters { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 82px; }
.filters h2 { font-size: 17px; margin: 0; font-weight: 800; }
.filter-toggle { display: none; }
.results-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; }
.results-head .count { font-weight: 700; }
.sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.sort select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.table-head, .job-row { display: grid; grid-template-columns: 1fr 150px 150px 84px; gap: 16px; }
.table-head { padding: 0 18px 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
.job-row { align-items: center; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; cursor: pointer; transition: border-color .12s, transform .12s, background .12s; }
.job-row:hover, .job-row:focus-visible { border-color: var(--blue); background: var(--panel2); }
.job-main { display: flex; gap: 14px; align-items: center; min-width: 0; }
.logo { flex: none; width: 46px; height: 46px; border-radius: 10px; background: var(--blue-bg); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--blue-soft); overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.logo.lg { width: 66px; height: 66px; font-size: 24px; border-radius: 14px; }
.job-main h3 { margin: 0; font-size: 16.5px; line-height: 1.3; font-weight: 700; }
.job-main .sub { margin: 1px 0 7px; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--panel2); border: 1px solid var(--line); color: var(--soft); border-radius: 99px; padding: 1px 10px; font-size: 12px; font-weight: 600; }
.chip.remote { color: var(--blue-soft); border-color: rgba(45,107,255,.5); background: var(--blue-bg); }
.chip.new { background: var(--red); border-color: var(--red); color: #fff; }
.job-salary { font-weight: 800; color: var(--blue-soft); font-variant-numeric: tabular-nums; }
.job-salary.none { color: var(--muted); font-weight: 500; }
.job-salary small, .job-time small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.job-time { font-size: 14px; color: var(--soft); font-weight: 600; }
.save-btn { justify-self: end; }
.more-wrap { text-align: center; padding: 22px 0 0; }

/* states */
.skeleton { height: 82px; margin: 0 0 10px; border-radius: var(--radius); background: linear-gradient(90deg, var(--panel), var(--panel2), var(--panel)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
.skeleton.line { height: 14px; margin: 0 0 12px; border-radius: 6px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 44px 24px; text-align: center; color: var(--soft); }
.empty h2 { margin: 0 0 8px; font-weight: 800; color: #fff; }
.empty p { margin: 0 0 18px; }

/* detail */
.detail, .apply, .done, .mine { padding: 30px 0 90px; }
.back { display: inline-flex; gap: 6px; align-items: center; background: none; border: none; color: var(--muted); padding: 0; margin-bottom: 22px; font-size: 14px; font-weight: 600; }
.back:hover { color: #fff; }
.detail-head { display: flex; gap: 18px; align-items: center; margin-bottom: 24px; }
.detail-head h1, .apply h1, .done h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; margin: 0 0 4px; font-weight: 800; letter-spacing: -.02em; }
.detail-head .sub, .apply .sub { margin: 0; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; padding: 20px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 32px; }
.facts dt { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.facts dd { margin: 0; font-weight: 700; }
.facts dd small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.detail-grid { display: grid; grid-template-columns: 1fr 340px; gap: 44px; align-items: start; }
.prose h2, .side h2 { font-size: 21px; font-weight: 800; margin: 0 0 14px; letter-spacing: -.01em; }
.prose { max-width: 74ch; color: var(--soft); overflow-wrap: anywhere; }
.prose p, .prose ul, .prose ol { margin: 0 0 15px; }
.prose h3, .prose h4, .prose h5, .prose h6 { color: #fff; margin: 24px 0 8px; font-size: 17px; }
.prose a { color: var(--blue-soft); text-decoration: underline; }
.prose li { margin-bottom: 5px; }
.prose table { border-collapse: collapse; display: block; overflow-x: auto; }
.prose td, .prose th { border: 1px solid var(--line); padding: 6px 10px; }
.extras { display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14.5px; }
.extras dt { color: var(--muted); font-weight: 600; } .extras dd { margin: 0; color: var(--soft); }
.side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card h2 { font-size: 18px; }
.actions { display: grid; gap: 10px; margin-bottom: 18px; }
.steps { margin: 0; padding-left: 20px; color: var(--soft); font-size: 14px; }
.steps li { margin-bottom: 7px; }
.co-list { list-style: none; margin: 12px 0 0; padding: 0; font-size: 14px; }
.co-list li { padding: 8px 0; border-top: 1px solid var(--line); }
.co-list a { color: var(--blue-soft); } .co-list a:hover { text-decoration: underline; }
.muted { color: var(--muted); font-size: 13px; }

/* apply form */
.apply-grid { display: grid; grid-template-columns: 1fr 330px; gap: 32px; align-items: start; margin-top: 26px; }
.form { padding: 0; overflow: hidden; }
.form section { padding: 26px; border-bottom: 1px solid var(--line); }
.form h2 { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 800; margin: 0 0 20px; }
.num { width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 800; flex: none; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.cols .full { grid-column: 1 / -1; }
.drop { border: 2px dashed var(--line); border-radius: var(--radius); padding: 28px 18px; text-align: center; background: var(--bg2); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--blue); background: var(--blue-bg); }
.drop.invalid { border-color: var(--red); }
.drop p { margin: 0 0 4px; } .drop .big { font-weight: 700; }
.file-chip { display: flex; align-items: center; gap: 12px; background: var(--blue-bg); border: 1px solid rgba(45,107,255,.5); border-radius: var(--radius); padding: 12px 14px; }
.file-ico { width: 38px; height: 38px; border-radius: 8px; background: var(--blue); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.file-chip .meta { flex: 1; min-width: 0; } .file-chip .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; cursor: pointer; }
.radio:has(input:checked) { border-color: var(--blue); background: var(--blue-bg); }
.radio input { accent-color: var(--blue); margin-top: 5px; }
.form-foot { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 18px; }
.form-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.summary { position: sticky; top: 84px; }
.summary .logo { margin-bottom: 14px; }
.summary h3 { margin: 0 0 2px; font-size: 18px; font-weight: 800; }
.summary dl { margin: 16px 0 0; display: grid; gap: 12px; font-size: 14px; }
.summary dt { color: var(--muted); font-size: 12px; font-weight: 600; } .summary dd { margin: 0; font-weight: 600; }
.notice { background: var(--red-bg); border: 1px solid rgba(240,55,58,.45); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; color: var(--soft); }
.notice b { color: #fff; }

/* done */
.done .tick { width: 60px; height: 60px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; font-size: 30px; margin-bottom: 18px; }
.done-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 26px; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.checklist li { display: flex; gap: 12px; align-items: flex-start; }
.checklist .ok { width: 22px; height: 22px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; font-size: 12px; flex: none; margin-top: 2px; }
.checklist .todo { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--red); flex: none; margin-top: 2px; }
.status { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 11px; background: var(--blue-bg); color: var(--blue-soft); border: 1px solid rgba(45,107,255,.5); }
.status.sent { background: var(--red-bg); color: var(--red-hover); border-color: rgba(240,55,58,.5); }
.tabs { display: flex; gap: 8px; margin: 14px 0 18px; }
.page-title { font-size: 34px; margin: 0 0 4px; font-weight: 800; letter-spacing: -.02em; }

/* footer & toast */
.footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: 13px; }
.footer .wrap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.footer a { text-decoration: underline; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #fff; color: #06060A; font-weight: 600; padding: 11px 20px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; max-width: 90vw; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 920px) {
  .layout { grid-template-columns: 1fr; gap: 14px; }
  .filters { position: static; display: none; } .filters.open { display: flex; }
  .filter-toggle { display: inline-flex; }
  .detail-grid, .apply-grid, .done-grid { grid-template-columns: 1fr; }
  .side, .summary { position: static; }
}
@media (max-width: 680px) {
  .searchbar, .cols { grid-template-columns: 1fr; }
  .table-head { display: none; }
  .job-row { grid-template-columns: 1fr auto; row-gap: 10px; }
  .job-main { grid-column: 1 / -1; }
  .save-btn { grid-column: 2; grid-row: 2; }
  .nav a { padding: 8px 10px; font-size: 14px; }
  .topbar .wrap { gap: 10px; }
  .detail-head { align-items: flex-start; }
  .extras { grid-template-columns: 1fr; gap: 2px; } .extras dd { margin-bottom: 10px; }
  .hero { padding: 38px 0 26px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Roster home"><span class="brand-mark"></span>Roster</a>
    <nav class="nav" aria-label="Main">
      <a href="#/" id="nav-browse">Browse jobs</a>
      <a href="#/mine" id="nav-mine">My jobs<span class="pill" id="mine-count" hidden>0</span></a>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer class="footer">
  <div class="wrap">
    <span id="foot-sources">Real job listings from public and government job boards.</span>
    <span>Always check the details on the employer's official posting before applying.</span>
  </div>
</footer>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ======================================================================
   ROSTER (single file). Optional: add free Adzuna credentials below to
   include India / US / UK listings (https://developer.adzuna.com).
   ====================================================================== */
const CONFIG = { adzuna: { appId: "", appKey: "", country: "in" } };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const safeUrl = u => (/^https:\/\//i.test(u || "") ? u : "");
const first = v => Array.isArray(v) ? v[0] : v;
const initials = n => (String(n || "?").trim().match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase();
const decodeEntities = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
const txt = s => decodeEntities(String(s ?? "")).replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
const fmtBytes = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1) + " MB";
const shortDate = ms => new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }
function timeAgo(ms) {
  if (!ms) return "Date not given";
  const d = Math.max(0, Date.now() - ms), m = 6e4, h = 60 * m, day = 24 * h;
  if (d < h) return Math.max(1, Math.round(d / m)) + " min ago";
  if (d < day) return Math.round(d / h) + " hr ago";
  if (d < 30 * day) { const n = Math.round(d / day); return n + (n === 1 ? " day ago" : " days ago"); }
  if (d < 365 * day) { const n = Math.round(d / (30 * day)); return n + (n === 1 ? " month ago" : " months ago"); }
  return "Over a year ago";
}
const fullDate = ms => ms ? new Date(ms).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) : "Not given";

/* storage for larger items (listings cache, resumes) */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try { const r = indexedDB.open("roster", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction("kv", mode), q = fn(t.objectStore("kv")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return { get: k => tx("readonly", s => s.get(k)).catch(() => undefined), set: (k, v) => tx("readwrite", s => s.put(v, k)).then(() => true).catch(() => false), del: k => tx("readwrite", s => s.delete(k)).catch(() => false) };
})();

/* ---------- salary ---------- */
function parseSalary(text) {
  const raw = String(text ?? "").trim(); if (!raw) return null;
  const currency = /€|\beur\b/i.test(raw) ? "€" : /£|\bgbp\b/i.test(raw) ? "£" : /₹|\binr\b|\blpa\b/i.test(raw) ? "₹" : /\$|\busd\b/i.test(raw) ? "$" : "";
  const hourly = /(\/\s*h(ou)?r\b|per\s+hour|hourly|an\s+hour|stunde)/i.test(raw), monthly = /(\/\s*mo(nth)?\b|per\s+month|monthly|monat)/i.test(raw);

app.addEventListener("input", e => {
  if (e.target.id === "a-cover") { $("#cover-n").textContent = e.target.value.length; return; }
  if (e.target.name === "rs") { useSaved = e.target.value === "saved"; if (!useSaved) resumeFile = null; drawResume(); return; }
  const k = e.target.dataset?.f; if (!k) return;
  state.filters[k] = e.target.type === "checkbox" ? e.target.checked : e.target.value; if (k !== "q" && k !== "loc") applyFilters(); else applyFilters();
});
app.addEventListener("change", e => { if (e.target.id === "resume-input") { setResume(e.target.files[0]); } });
app.addEventListener("submit", e => { if (e.target.id === "apply-form") { e.preventDefault(); submitApply(); } });
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches(".searchbar input")) { runSearch(); $("#list")?.scrollIntoView({ block: "start" }); }
  const row = e.target.closest?.(".job-row"); if (row && e.target === row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openJob(row.dataset.id); }
});
["dragover", "dragleave", "drop"].forEach(ev => app.addEventListener(ev, e => {
  const z = e.target.closest?.("#drop"); if (!z) return; e.preventDefault();
  z.classList.toggle("over", ev === "dragover"); if (ev === "drop") setResume(e.dataTransfer.files[0]);
}));
const openJob = id => { state.scrollY = window.scrollY; location.hash = "#/job/" + encodeURIComponent(id); };
function toggleSave(id) { const j = findJob(id); if (!j) return; if (state.saved[id]) { delete state.saved[id]; toast("Removed from My jobs"); } else { state.saved[id] = lite(j); toast("Saved to My jobs"); } persist(); }
async function copyText(t, msg = "Copied") { try { await navigator.clipboard.writeText(t); toast(msg); } catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(msg); } catch { toast("Couldn't copy. Please select the text manually."); } ta.remove(); } }
function clearFilters() { Object.assign(state.filters, { q: "", loc: "", category: "", type: "", workplace: "", source: "", minSalary: "", salaryOnly: false, posted: "" }); state.visible = 25; if (currentView === "browse") renderBrowse(); runSearch(); }

document.addEventListener("click", e => {
  const t = e.target, c = sel => t.closest(sel);
  let el;
  if ((el = c("[data-save]"))) { e.stopPropagation(); toggleSave(el.dataset.save); const y = scrollY; if (currentView === "detail") { renderDetail(currentId); scrollTo(0, y); } else if (currentView === "mine") renderMine(); else renderResults(); return; }
  if ((el = c("[data-go]"))) { location.hash = el.dataset.go; return; }
  if ((el = c("[data-copy]"))) { copyText(el.dataset.copy, "Link copied"); return; }
  if ((el = c("[data-copy-text]"))) { copyText(state.apps[el.dataset.copyText].applicant.cover, "Cover letter copied"); return; }
  if ((el = c("[data-tab]"))) { mineTab = el.dataset.tab; renderMine(); return; }
  if ((el = c("[data-quick]"))) { try { Object.assign(state.filters, JSON.parse(el.dataset.quick)); } catch {} state.visible = 25; renderBrowse(); runSearch(); return; }
  if ((el = c("[data-sent]"))) { const a = state.apps[el.dataset.sent]; if (a.status === "Submitted") { a.status = "Prepared"; delete a.sentOn; } else { a.status = "Submitted"; a.sentOn = Date.now(); toast("Marked as submitted. Good luck!"); } persist(); renderDone(el.dataset.sent); return; }
  if ((el = c("[data-dl-resume]"))) { downloadResume(el.dataset.dlResume); return; }
  if ((el = c("[data-dl-summary]"))) { downloadSummary(el.dataset.dlSummary); return; }
  if (c("[data-resume-pick]")) { $("#resume-input").click(); return; }
  if (c("[data-resume-remove]")) { resumeFile = null; useSaved = false; drawResume(); return; }
  if ((el = c(".job-row"))) { if (currentView === "mine") { location.hash = "#/job/" + encodeURIComponent(el.dataset.id); } else openJob(el.dataset.id); return; }
  if (c("#search-btn")) { runSearch(); $("#list")?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (c("#clear-btn") || c("#clear-btn2")) { clearFilters(); return; }
  if (c("#more-btn")) { state.visible += 25; renderResults(); return; }
  if (c("#retry-btn")) { state.loading = true; renderResults(); renderStats(); loadSources(Object.keys(SOURCES), true); return; }
  if ((el = c("#filter-toggle"))) { const box = $("#filters"), open = box.classList.toggle("open"); el.textContent = open ? "Hide filters" : "Show filters"; el.setAttribute("aria-expanded", open); }
});

/* ---------- start ---------- */
updateMine();
route();
loadSources(Object.keys(SOURCES), false);
</script>
</body>
</html>
